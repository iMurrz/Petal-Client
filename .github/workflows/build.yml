name: Build Petal Client

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm install --no-audit --no-fund

      - name: Check launcher sources
        working-directory: launcher
        run: npm run check

      - name: Build mod, token wrapper and installer
        working-directory: launcher
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: petal-mod
          path: mod/build/libs/petal-client-*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: petal-installer
          path: launcher/release/*.exe
