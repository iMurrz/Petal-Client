<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Petal · SMP Survival</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">
        <g fill="#FF4FA3"><rect x="1" y="0" width="2" height="1"/><rect x="0" y="1" width="3" height="2"/><rect x="4" y="0" width="2" height="1"/><rect x="4" y="1" width="3" height="2"/><rect x="0" y="4" width="3" height="2"/><rect x="1" y="6" width="2" height="1"/><rect x="4" y="4" width="3" height="2"/><rect x="4" y="6" width="2" height="1"/></g>
        <rect x="3" y="3" width="1" height="1" fill="#FBEFF5"/>
      </svg>
      <div>
        <div class="brand-name">PETAL</div>
        <div class="brand-sub" id="brand-version">CLIENT</div>
      </div>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-page="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="7 5 19 12 7 19 7 5"/></svg>Play
      </button>
      <button data-page="mods">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></svg>Mods
      </button>
      <button data-page="instances">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="6"/><rect x="3" y="15" width="18" height="6"/><path d="M7 6h10M7 18h10"/></svg>Instances
      </button>
      <button data-page="downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></svg>Downloads
      </button>
      <button data-page="locker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8l5 4-3 3-2-1.5V20H8V9.5L6 11 3 8z"/></svg>Locker
      </button>
      <button data-page="screenshots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><circle cx="8" cy="9" r="2"/><path d="m3 18 6-5 4 3 4-6 4 7"/></svg>Screenshots
      </button>
      <button data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings
      </button>
    </nav>
    <div class="side-foot">
      <button class="me" id="me" type="button"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Play</h1>
      <div class="win">
        <button id="win-min" aria-label="Minimize"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="win-close" class="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="modal hidden" id="signin" role="dialog" aria-modal="true" aria-labelledby="signin-title">
  <div class="dialog">
    <span class="eyebrow">Microsoft sign-in</span>
    <h2 id="signin-title">Enter this code</h2>
    <p class="note" id="signin-text">Your browser opened microsoft.com/link. Type the code below there and sign in with the account that owns Minecraft.</p>
    <div class="code" id="signin-code">········</div>
    <div class="dialog-actions">
      <button class="btn btn-pink" id="signin-copy">Copy code</button>
      <button class="btn btn-dark" id="signin-open">Open sign-in page</button>
      <button class="btn btn-line" id="signin-cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
